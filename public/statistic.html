<!DOCTYPE html>

tailwind.config = { theme: { extend: {

  colors: {
    leaf: { 50:'#f3f8ef',100:'#e4efdb',200:'#cbe1bb',300:'#a9cf94',400:'#86b872',500:'#679d55',600:'#4f7f42',700:'#3f6537',800:'#34512f',900:'#2b4328' },
    cream: { 50:'#fdfcf6',100:'#faf7ea',200:'#f3edd3' },

<body class="font-sans text-leaf-900 min-h-screen antialiased">
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-sky2-100 via-cream-50 to-leaf-100"></div>

</div>

<main class="max-w-xl mx-auto px-4 pt-4 pb-[calc(2.5rem+env(safe-area-inset-bottom))] space-y-4">

  <!-- Pemilih periode -->
  <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-2">
    <div id="rangeTabs" class="grid grid-cols-4 gap-1.5"></div>
  </section>

  <div id="content" class="space-y-4">
    <div class="rounded-[1.75rem] bg-white/85 border border-leaf-100 p-8 text-center text-leaf-600 text-sm font-bold">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat statistik...
    </div>
  </div>

  <!-- Hari kerja fleksibel -->
  <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-sky2-100 text-sky2-400 flex items-center justify-center"><i class="fa-solid fa-briefcase"></i></div>
      <div>
        <h3 class="text-base font-extrabold text-leaf-900">Hari Kerja</h3>
        <p class="text-xs text-leaf-600">Senin–Jumat selalu dihitung. Sabtu & Minggu opsional.</p>
      </div>
    </div>
    <div id="workdaySettings" class="mt-4 space-y-2.5"></div>
  </section>
</main>

<script>
/* ======================= Util umum ======================= */
const $ = (id) => document.getElementById(id);
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI_S = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const mondayOf = (iso) => { const d = parseISO(iso); const w = d.getDay(); d.setDate(d.getDate() + (w === 0 ? -6 : 1 - w)); return toISO(d); };
const todayISO = () => toISO(new Date());
const shortDate = (iso) => { const d = parseISO(iso); return `${HARI_S[d.getDay()]}, ${d.getDate()} ${BULAN_S[d.getMonth()]}`; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(url, opts = {}) {
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
    throw new Error('Sesi berakhir.');
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.message) || 'Terjadi kesalahan pada server.');
  return data;
}

function toast(type, msg) {
  const map = {
    success: ['bg-leaf-100 border-leaf-300 text-leaf-800', 'fa-circle-check'],
    error: ['bg-rose2-100 border-rose2-200 text-rose2-600', 'fa-circle-exclamation'],
    info: ['bg-sky2-100 border-sky2-200 text-leaf-800', 'fa-circle-info'],
  };
  const [cls, icon] = map[type] || map.info;
  const el = document.createElement('div');
  el.className = `pointer-events-auto animate-pop flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-lg ${cls}`;
  el.innerHTML = `<i class="fa-solid ${icon} mt-0.5"></i><p class="text-sm font-bold flex-1 break-words">${esc(msg)}</p>`;
  $('toastList').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
}

/* ======================= Navbar hamburger ======================= */
const NAV_ITEMS = [
  { href: '/', icon: 'fa-house', label: 'Beranda & Laporan' },
  { href: '/calendar', icon: 'fa-calendar-days', label: 'Kalender' },
  { href: '/statistic', icon: 'fa-chart-simple', label: 'Statistik' },
  { href: '/export', icon: 'fa-file-pdf', label: 'Export PDF' },
];
function mountNav(active, pageTitle) {
  const links = NAV_ITEMS.map((i) =>
    `<a href="${i.href}" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold transition ${i.href === active ? 'bg-leaf-500 text-white shadow-sm' : 'text-leaf-800 hover:bg-leaf-100'}">
       <i class="fa-solid ${i.icon} w-5 text-center"></i>${i.label}</a>`).join('');
  $('navRoot').innerHTML = `
    <header class="sticky top-0 z-40 bg-cream-50/85 backdrop-blur-md border-b border-leaf-100 pt-[env(safe-area-inset-top)]">
      <div class="max-w-xl mx-auto h-14 px-4 flex items-center gap-3">
        <button id="menuOpen" aria-label="Buka menu" class="w-10 h-10 rounded-2xl bg-leaf-100 text-leaf-700 flex items-center justify-center active:scale-95"><i class="fa-solid fa-bars"></i></button>
        <div class="leading-tight">
          <p class="text-[11px] font-bold tracking-wide text-leaf-600 uppercase">Hiro Zenith Report</p>
          <h1 class="text-base font-extrabold text-leaf-900">${pageTitle}</h1>
        </div>
      </div>
    </header>
    <div id="drawer" class="fixed inset-0 z-[60] pointer-events-none">
      <div id="drawerOverlay" class="absolute inset-0 bg-leaf-900/40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
      <aside id="drawerPanel" class="absolute left-0 top-0 h-full w-72 max-w-[82%] bg-cream-50 shadow-2xl -translate-x-full transition-transform duration-300 flex flex-col pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
        <div class="flex items-center justify-between px-5 h-14 border-b border-leaf-100">
          <div class="flex items-center gap-2 font-extrabold text-leaf-800"><i class="fa-solid fa-leaf text-leaf-500"></i> Menu</div>
          <button id="menuClose" aria-label="Tutup menu" class="w-9 h-9 rounded-xl bg-leaf-100 text-leaf-700 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="p-4 space-y-2 flex-1">${links}</nav>
        <div class="p-4 border-t border-leaf-100">
          <button id="btnLock" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold text-rose2-600 bg-rose2-100 active:scale-[.98]">
            <i class="fa-solid fa-lock w-5 text-center"></i>Kunci Aplikasi
          </button>
        </div>
      </aside>
    </div>`;
  const open = () => { $('drawer').classList.remove('pointer-events-none'); $('drawerOverlay').classList.remove('opacity-0'); $('drawerPanel').classList.remove('-translate-x-full'); };
  const close = () => { $('drawer').classList.add('pointer-events-none'); $('drawerOverlay').classList.add('opacity-0'); $('drawerPanel').classList.add('-translate-x-full'); };
  $('menuOpen').addEventListener('click', open);
  $('menuClose').addEventListener('click', close);
  $('drawerOverlay').addEventListener('click', close);
  $('btnLock').addEventListener('click', async () => {
    try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
    location.href = '/login';
  });
}

/* ======================= State & logika statistik ======================= */
const RANGES = [
  { key: 'week', label: 'Minggu' },
  { key: 'month', label: 'Bulan' },
  { key: '30', label: '30 Hari' },
  { key: 'all', label: 'Semua' },
];
const S = { all: [], counts: {}, byWeekday: [], settings: { includeSaturday: false, includeSunday: false }, range: 'week', first: null };

const isWorkday = (iso) => {
  const w = parseISO(iso).getDay();
  if (w === 6) return S.settings.includeSaturday;
  if (w === 0) return S.settings.includeSunday;
  return true;
};

function getRange(kind) {
  const today = todayISO();
  let start, end;
  if (kind === 'week') { start = mondayOf(today); end = addDays(start, 6); }
  else if (kind === 'month') {
    const d = parseISO(today);
    start = toISO(new Date(d.getFullYear(), d.getMonth(), 1));
    end = toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  }
  else if (kind === '30') { end = today; start = addDays(today, -29); }
  else { start = S.first || today; end = today; }
  if (S.first && start < S.first) start = S.first; // hari sebelum laporan pertama tidak dihitung "terlewat"
  return { start, end };
}

// Hitung ringkasan untuk rentang tertentu
function summarize(start, end) {
  const today = todayISO();
  const days = [];
  for (let d = start, guard = 0; d <= end && guard < 4000; d = addDays(d, 1), guard++) {
    days.push({ date: d, count: S.counts[d] || 0, work: isWorkday(d) });
  }
  const workdays = days.filter((x) => x.work);
  const due = workdays.filter((x) => x.date < today || (x.date === today && x.count > 0));
  const filled = due.filter((x) => x.count > 0);
  const missed = workdays.filter((x) => x.date < today && x.count === 0 && (!S.first || x.date >= S.first));
  const pendingToday = workdays.some((x) => x.date === today && x.count === 0);
  const total = days.reduce((a, x) => a + x.count, 0);
  const bonus = days.filter((x) => !x.work).reduce((a, x) => a + x.count, 0);
  const activeDays = days.filter((x) => x.count > 0).length;
  const pct = due.length ? Math.round((filled.length / due.length) * 100) : 0;
  return { days, workdays, due, filled, missed, pendingToday, total, bonus, activeDays, pct };
}

function streaks() {
  if (!S.first) return { current: 0, longest: 0 };
  const today = todayISO();
  let cur = 0, longest = 0;
  for (let d = S.first, guard = 0; d <= today && guard < 4000; d = addDays(d, 1), guard++) {
    if (!isWorkday(d)) continue;
    const c = S.counts[d] || 0;
    if (c > 0) { cur++; if (cur > longest) longest = cur; }
    else if (d !== today) cur = 0; // hari ini belum diisi = masih pending, tidak memutus
  }
  return { current: cur, longest };
}

function weekTrend(n = 8) {
  const today = todayISO();
  const thisMon = mondayOf(today);
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const ws = addDays(thisMon, -7 * i);
    const we = addDays(ws, 6);
    const tracked = S.first && we >= S.first;
    if (!tracked) { out.push({ ws, pct: null, count: 0 }); continue; }
    const s = summarize(ws < S.first ? S.first : ws, we);
    out.push({ ws, pct: s.due.length ? s.pct : null, count: s.total, due: s.due.length, filled: s.filled.length });
  }
  return out;
}

/* ======================= Render ======================= */
function renderTabs() {
  $('rangeTabs').innerHTML = RANGES.map((r) =>
    `<button data-range="${r.key}" class="h-11 rounded-2xl text-sm font-extrabold transition active:scale-95 ${S.range === r.key ? 'bg-leaf-500 text-white shadow-sm' : 'text-leaf-700 hover:bg-leaf-100'}">${r.label}</button>`).join('');
}

function ring(pct) {
  const R = 42, C = 2 * Math.PI * R, off = C * (1 - pct / 100);
  return `<svg viewBox="0 0 100 100" class="w-28 h-28 -rotate-90">
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="#e4efdb" stroke-width="10"/>
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="#679d55" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .8s ease"/>
  </svg>`;
}

function statCard(icon, tone, value, label) {
  return `<div class="rounded-2xl bg-white/85 border border-leaf-100 p-4 shadow-sm">
    <div class="w-9 h-9 rounded-xl ${tone} flex items-center justify-center text-sm"><i class="fa-solid ${icon}"></i></div>
    <p class="mt-3 text-2xl font-extrabold text-leaf-900 leading-none">${value}</p>
    <p class="mt-1 text-xs font-bold text-leaf-600">${label}</p></div>`;
}

function render() {
  renderTabs();
  renderSettings();
  const el = $('content');

  if (!S.first) {
    el.innerHTML = `<div class="rounded-[1.75rem] bg-white/85 border border-leaf-100 p-8 text-center shadow-sm">
      <div class="w-16 h-16 mx-auto rounded-3xl bg-leaf-100 text-leaf-500 flex items-center justify-center text-2xl"><i class="fa-solid fa-seedling"></i></div>
      <h3 class="mt-4 text-base font-extrabold text-leaf-900">Belum ada data</h3>
      <p class="mt-1 text-sm text-leaf-600">Statistik akan muncul setelah kamu menambahkan laporan pertama.</p>
      <a href="/" class="mt-4 inline-flex items-center gap-2 h-11 px-5 rounded-2xl bg-leaf-500 text-white text-sm font-extrabold"><i class="fa-solid fa-plus"></i>Tambah Kegiatan</a></div>`;
    return;
  }

  const { start, end } = getRange(S.range);
  const s = summarize(start, end);
  const st = streaks();
  const avg = s.activeDays ? (s.total / s.activeDays).toFixed(1).replace('.', ',') : '0';
  const rangeText = `${shortDate(start)} — ${shortDate(end)}`;

  // Distribusi per hari dalam seminggu
  const perDow = [1, 2, 3, 4, 5, 6, 0].map((w) => ({ w, n: 0 }));
  s.days.forEach((d) => { const w = parseISO(d.date).getDay(); perDow.find((x) => x.w === w).n += d.count; });
  const maxDow = Math.max(1, ...perDow.map((x) => x.n));

  // Tren 8 minggu
  const trend = weekTrend(8);

  // Hari belum dibuat
  const missedSorted = [...s.missed].reverse();
  const shown = missedSorted.slice(0, 30);

  const encourage = s.pct >= 90 ? 'Luar biasa, konsisten sekali!' : s.pct >= 70 ? 'Bagus, pertahankan ritmenya.' : s.pct >= 40 ? 'Lumayan, yuk lengkapi yang terlewat.' : 'Ayo mulai isi laporan yang tertinggal.';

  el.innerHTML = `
    <section class="rounded-[1.75rem] bg-gradient-to-br from-leaf-200 via-leaf-100 to-sky2-100 border border-leaf-200/70 p-5 shadow-sm">
      <p class="text-xs font-bold text-leaf-700 uppercase tracking-wide">Progres Pengisian</p>
      <p class="text-xs text-leaf-700 mt-0.5">${rangeText}</p>
      <div class="mt-3 flex items-center gap-5">
        <div class="relative shrink-0">${ring(s.pct)}
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-2xl font-extrabold text-leaf-900 leading-none">${s.pct}%</span>
            <span class="text-[10px] font-bold text-leaf-600 mt-0.5">terisi</span>
          </div>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-extrabold text-leaf-900">${s.filled.length} dari ${s.due.length} hari kerja</p>
          <p class="mt-1 text-xs text-leaf-700">${encourage}</p>
          ${s.pendingToday ? '<p class="mt-2 inline-flex items-center gap-1.5 rounded-full bg-peach-100 text-peach-600 text-[11px] font-extrabold px-2.5 py-1"><i class="fa-solid fa-hourglass-half"></i>Hari ini belum diisi</p>' : ''}
        </div>
      </div>
    </section>

    <section class="grid grid-cols-2 gap-3">
      ${statCard('fa-list-check', 'bg-leaf-100 text-leaf-600', s.total, 'Total kegiatan')}
      ${statCard('fa-calendar-check', 'bg-sky2-100 text-sky2-400', s.activeDays, 'Hari ada laporan')}
      ${statCard('fa-triangle-exclamation', 'bg-rose2-100 text-rose2-600', s.missed.length, 'Hari belum dibuat')}
      ${statCard('fa-chart-line', 'bg-peach-100 text-peach-600', avg, 'Rata-rata / hari')}
    </section>

    <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-peach-100 text-peach-600 flex items-center justify-center text-xl"><i class="fa-solid fa-fire"></i></div>
        <div class="flex-1">
          <p class="text-xs font-bold text-leaf-600">Streak hari kerja berturut-turut</p>
          <p class="text-xl font-extrabold text-leaf-900 leading-tight">${st.current} hari</p>
        </div>
        <div class="text-right">
          <p class="text-[11px] font-bold text-leaf-600">Terpanjang</p>
          <p class="text-base font-extrabold text-leaf-800">${st.longest} hari</p>
        </div>
      </div>
      ${s.bonus > 0 ? `<p class="mt-3 text-xs text-leaf-600 flex items-center gap-2"><i class="fa-solid fa-star text-peach-400"></i>${s.bonus} kegiatan di luar hari kerja (bonus).</p>` : ''}
    </section>

    <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
      <h3 class="text-base font-extrabold text-leaf-900">Tren 8 Minggu Terakhir</h3>
      <p class="text-xs text-leaf-600">Persentase hari kerja yang sudah terisi</p>
      <div class="mt-4 flex items-end gap-2 h-40">
        ${trend.map((t) => {
          const h = t.pct === null ? 4 : Math.max(6, t.pct);
          const color = t.pct === null ? 'bg-leaf-100' : t.pct >= 80 ? 'bg-leaf-500' : t.pct >= 50 ? 'bg-leaf-300' : 'bg-peach-400';
          const d = parseISO(t.ws);
          return `<div class="flex-1 h-full flex flex-col items-center justify-end min-w-0">
            <span class="text-[10px] font-extrabold text-leaf-700 mb-1">${t.pct === null ? '–' : t.pct + '%'}</span>
            <div class="w-full rounded-t-xl ${color} origin-bottom animate-grow" style="height:${h}%"></div>
            <span class="mt-1.5 text-[10px] font-bold text-leaf-600 leading-none">${d.getDate()}/${d.getMonth() + 1}</span>
          </div>`;
        }).join('')}
      </div>
      <p class="mt-2 text-[11px] text-leaf-500 text-center">Label = tanggal Senin tiap minggu</p>
    </section>

    <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
      <h3 class="text-base font-extrabold text-leaf-900">Kegiatan per Hari</h3>
      <p class="text-xs text-leaf-600">Jumlah kegiatan berdasarkan hari dalam seminggu</p>
      <div class="mt-4 space-y-2.5">
        ${perDow.map((x) => {
          const off = !(x.w === 6 ? S.settings.includeSaturday : x.w === 0 ? S.settings.includeSunday : true);
          return `<div class="flex items-center gap-3">
            <span class="w-12 text-xs font-extrabold ${off ? 'text-leaf-400' : 'text-leaf-700'}">${HARI_S[x.w]}</span>
            <div class="flex-1 h-3.5 rounded-full bg-leaf-100 overflow-hidden"><div class="h-full rounded-full ${off ? 'bg-peach-200' : 'bg-leaf-400'}" style="width:${(x.n / maxDow) * 100}%"></div></div>
            <span class="w-6 text-right text-xs font-extrabold text-leaf-800">${x.n}</span>
          </div>`;
        }).join('')}
      </div>
    </section>

    <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h3 class="text-base font-extrabold text-leaf-900">Belum Dibuat Laporan</h3>
          <p class="text-xs text-leaf-600">Ketuk tanggal untuk langsung mengisi</p>
        </div>
        <span class="shrink-0 min-w-[2rem] h-8 px-2.5 rounded-full ${s.missed.length ? 'bg-rose2-100 text-rose2-600' : 'bg-leaf-100 text-leaf-700'} text-sm font-extrabold flex items-center justify-center">${s.missed.length}</span>
      </div>
      ${s.missed.length ? `
        <div class="mt-4 flex flex-wrap gap-2">
          ${shown.map((m) => `<a href="/?date=${m.date}" class="inline-flex items-center gap-1.5 h-9 px-3 rounded-full bg-rose2-100 border border-rose2-200 text-rose2-600 text-xs font-extrabold active:scale-95"><i class="fa-solid fa-plus text-[10px]"></i>${shortDate(m.date)}</a>`).join('')}
        </div>
        ${missedSorted.length > shown.length ? `<p class="mt-3 text-xs text-leaf-600">+ ${missedSorted.length - shown.length} hari lainnya. Lihat selengkapnya di <a href="/calendar" class="font-extrabold text-leaf-700 underline">Kalender</a>.</p>` : ''}`
      : `<div class="mt-4 rounded-2xl bg-leaf-100 text-leaf-800 p-4 text-sm font-bold flex items-center gap-3"><i class="fa-solid fa-circle-check text-leaf-500 text-lg"></i>Semua hari kerja pada periode ini sudah terisi. Hebat!</div>`}
    </section>`;
}

/* ======================= Pengaturan hari kerja ======================= */
function switchRow(key, icon, label, desc, on, locked) {
  return `<div ${locked ? '' : `data-toggle="${key}" role="switch" aria-checked="${on}" tabindex="0"`} class="flex items-center gap-3 rounded-2xl border p-3.5 ${locked ? 'bg-leaf-50 border-leaf-100' : 'bg-white border-leaf-100 cursor-pointer active:scale-[.99]'}">
    <div class="w-10 h-10 rounded-xl ${on ? 'bg-leaf-100 text-leaf-600' : 'bg-cream-100 text-leaf-400'} flex items-center justify-center"><i class="fa-solid ${icon}"></i></div>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-extrabold text-leaf-900">${label}</p>
      <p class="text-xs text-leaf-600">${desc}</p>
    </div>
    <div class="w-12 h-7 rounded-full p-0.5 transition ${on ? 'bg-leaf-500' : 'bg-leaf-200'} ${locked ? 'opacity-60' : ''}">
      <div class="w-6 h-6 rounded-full bg-white shadow transition-transform ${on ? 'translate-x-5' : ''}"></div>
    </div>
  </div>`;
}
function renderSettings() {
  $('workdaySettings').innerHTML =
    switchRow('weekdays', 'fa-business-time', 'Senin – Jumat', 'Selalu dihitung sebagai hari kerja', true, true) +
    switchRow('includeSaturday', 'fa-sun', 'Sabtu', 'Hitung sebagai hari kerja', S.settings.includeSaturday, false) +
    switchRow('includeSunday', 'fa-moon', 'Minggu', 'Hitung sebagai hari kerja', S.settings.includeSunday, false);
}
async function toggleDay(key) {
  const next = { ...S.settings, [key]: !S.settings[key] };
  try {
    S.settings = await api('/api/settings', { method: 'PUT', body: next });
    toast('success', `${key === 'includeSaturday' ? 'Sabtu' : 'Minggu'} ${S.settings[key] ? 'dihitung' : 'tidak dihitung'} sebagai hari kerja.`);
    render();
  } catch (e) { toast('error', e.message); }
}

/* ======================= Init ======================= */
async function init() {
  mountNav('/statistic', 'Statistik');

  $('rangeTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-range]');
    if (!b) return;
    S.range = b.dataset.range;
    render();
  });
  $('workdaySettings').addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle]');
    if (t) toggleDay(t.dataset.toggle);
  });

  try {
    const [st, all] = await Promise.all([api('/api/settings'), api('/api/activities')]);
    S.settings = st;
    S.all = all;
    S.counts = {};
    all.forEach((a) => { S.counts[a.date] = (S.counts[a.date] || 0) + 1; });
    S.first = all.length ? all[0].date : null;
    render();
  } catch (e) {
    toast('error', e.message);
    $('content').innerHTML = `<div class="rounded-[1.75rem] bg-rose2-100 border border-rose2-200 text-rose2-600 p-5 text-sm font-bold flex items-center gap-3"><i class="fa-solid fa-triangle-exclamation"></i><span class="flex-1">${esc(e.message)}</span>
      <button onclick="location.reload()" class="h-9 px-3 rounded-xl bg-white text-rose2-600 text-xs font-extrabold">Muat ulang</button></div>`;
  }
}
init();
</script>
</body>
</html>
