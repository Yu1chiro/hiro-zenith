<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4efdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kalender · Hiro Zenith Report</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Nunito', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
  colors: {
    leaf: { 50:'#f3f8ef',100:'#e4efdb',200:'#cbe1bb',300:'#a9cf94',400:'#86b872',500:'#679d55',600:'#4f7f42',700:'#3f6537',800:'#34512f',900:'#2b4328' },
    cream: { 50:'#fdfcf6',100:'#faf7ea',200:'#f3edd3' },
    sky2: { 100:'#e3f1f4',200:'#c7e3ea',400:'#7fb9c8' },
    peach: { 100:'#fdeedd',200:'#fadcbb',400:'#eea86c',600:'#c8823f' },
    rose2: { 100:'#fbe6e4',200:'#f6cbc7',400:'#e28f88',600:'#c4574f' }
  },
  keyframes: {
    pop: { '0%': { opacity: 0, transform: 'translateY(-8px) scale(.98)' }, '100%': { opacity: 1, transform: 'none' } },
    sheet: { '0%': { transform: 'translateY(30px)', opacity: 0 }, '100%': { transform: 'none', opacity: 1 } }
  },
  animation: { pop: 'pop .25s ease-out', sheet: 'sheet .25s ease-out' }
} } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="font-sans text-leaf-900 min-h-screen antialiased">
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-sky2-100 via-cream-50 to-leaf-100"></div>
<div class="fixed -z-10 top-24 -right-16 w-52 h-52 rounded-full bg-white/60 blur-2xl"></div>

<div id="navRoot"></div>

<div class="fixed top-16 inset-x-0 z-[80] px-4 pointer-events-none">
  <div id="toastList" class="max-w-xl mx-auto space-y-2"></div>
</div>

<main class="max-w-xl mx-auto px-4 pt-4 pb-[calc(2.5rem+env(safe-area-inset-bottom))] space-y-4">

  <!-- Kalender -->
  <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-4">
    <div class="flex items-center justify-between gap-2">
      <button id="monthPrev" aria-label="Bulan sebelumnya" class="w-11 h-11 rounded-2xl bg-leaf-100 text-leaf-700 active:scale-95 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="text-center">
        <h2 id="monthLabel" class="text-lg font-extrabold text-leaf-900">—</h2>
        <button id="monthNow" class="hidden mt-0.5 h-7 px-3 rounded-full bg-peach-100 text-peach-600 text-[11px] font-extrabold border border-peach-200">Kembali ke bulan ini</button>
      </div>
      <button id="monthNext" aria-label="Bulan berikutnya" class="w-11 h-11 rounded-2xl bg-leaf-100 text-leaf-700 active:scale-95 flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="mt-4 grid grid-cols-7 gap-1.5 text-center">
      <div class="text-[11px] font-extrabold text-leaf-600">Sen</div>
      <div class="text-[11px] font-extrabold text-leaf-600">Sel</div>
      <div class="text-[11px] font-extrabold text-leaf-600">Rab</div>
      <div class="text-[11px] font-extrabold text-leaf-600">Kam</div>
      <div class="text-[11px] font-extrabold text-leaf-600">Jum</div>
      <div class="text-[11px] font-extrabold text-leaf-600">Sab</div>
      <div class="text-[11px] font-extrabold text-leaf-600">Min</div>
    </div>
    <div id="grid" class="mt-2 grid grid-cols-7 gap-1.5"></div>

    <div class="mt-4 grid grid-cols-2 gap-x-3 gap-y-2 text-[11px] font-bold text-leaf-700">
      <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-md bg-leaf-400"></span>Sudah ada laporan</div>
      <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-md bg-rose2-100 border border-rose2-200"></span>Belum dibuat</div>
      <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-md bg-peach-100 border-2 border-peach-400"></span>Hari ini (kosong)</div>
      <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-md bg-white border border-leaf-100"></span>Belum tiba</div>
    </div>
  </section>

  <!-- Ringkasan bulan -->
  <section id="summary" class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5"></section>

  <!-- Hari kerja fleksibel -->
  <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-sky2-100 text-sky2-400 flex items-center justify-center"><i class="fa-solid fa-briefcase"></i></div>
      <div>
        <h3 class="text-base font-extrabold text-leaf-900">Hari Kerja</h3>
        <p class="text-xs text-leaf-600">Senin–Jumat selalu dihitung. Sabtu & Minggu opsional.</p>
      </div>
    </div>
    <div id="workdaySettings" class="mt-4 space-y-2.5"></div>
  </section>
</main>

<!-- Bottom sheet detail hari (div Tailwind) -->
<div id="sheet" class="hidden fixed inset-0 z-[90] items-end justify-center">
  <div id="sheetOverlay" class="absolute inset-0 bg-leaf-900/40 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-xl bg-cream-50 rounded-t-[2rem] shadow-2xl animate-sheet max-h-[85vh] flex flex-col pb-[env(safe-area-inset-bottom)]">
    <div class="pt-3 pb-1 flex justify-center"><div class="w-10 h-1.5 rounded-full bg-leaf-200"></div></div>
    <div class="px-5 pt-2 pb-3 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h3 id="sheetTitle" class="text-base font-extrabold text-leaf-900">—</h3>
        <div id="sheetBadge" class="mt-1.5"></div>
      </div>
      <button id="sheetClose" aria-label="Tutup" class="w-9 h-9 shrink-0 rounded-xl bg-leaf-100 text-leaf-700 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sheetBody" class="px-5 overflow-y-auto flex-1"></div>
    <div class="p-5">
      <a id="sheetAdd" href="/" class="w-full h-14 rounded-2xl bg-leaf-500 hover:bg-leaf-600 text-white text-base font-extrabold shadow-md shadow-leaf-500/30 flex items-center justify-center gap-2 active:scale-[.98]">
        <i class="fa-solid fa-plus"></i>Tambah Kegiatan
      </a>
    </div>
  </div>
</div>

<script>
/* ======================= Util umum ======================= */
const $ = (id) => document.getElementById(id);
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI_S = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const mondayOf = (iso) => { const d = parseISO(iso); const w = d.getDay(); d.setDate(d.getDate() + (w === 0 ? -6 : 1 - w)); return toISO(d); };
const todayISO = () => toISO(new Date());
const longDate = (iso) => { const d = parseISO(iso); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
const shortDate = (iso) => { const d = parseISO(iso); return `${HARI_S[d.getDay()]}, ${d.getDate()} ${BULAN_S[d.getMonth()]}`; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(url, opts = {}) {
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
    throw new Error('Sesi berakhir.');
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.message) || 'Terjadi kesalahan pada server.');
  return data;
}

function toast(type, msg) {
  const map = {
    success: ['bg-leaf-100 border-leaf-300 text-leaf-800', 'fa-circle-check'],
    error: ['bg-rose2-100 border-rose2-200 text-rose2-600', 'fa-circle-exclamation'],
    info: ['bg-sky2-100 border-sky2-200 text-leaf-800', 'fa-circle-info'],
  };
  const [cls, icon] = map[type] || map.info;
  const el = document.createElement('div');
  el.className = `pointer-events-auto animate-pop flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-lg ${cls}`;
  el.innerHTML = `<i class="fa-solid ${icon} mt-0.5"></i><p class="text-sm font-bold flex-1 break-words">${esc(msg)}</p>`;
  $('toastList').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
}

/* ======================= Navbar hamburger ======================= */
const NAV_ITEMS = [
  { href: '/', icon: 'fa-house', label: 'Beranda & Laporan' },
  { href: '/calendar', icon: 'fa-calendar-days', label: 'Kalender' },
  { href: '/statistic', icon: 'fa-chart-simple', label: 'Statistik' },
  { href: '/export', icon: 'fa-file-pdf', label: 'Export PDF' },
];
function mountNav(active, pageTitle) {
  const links = NAV_ITEMS.map((i) =>
    `<a href="${i.href}" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold transition ${i.href === active ? 'bg-leaf-500 text-white shadow-sm' : 'text-leaf-800 hover:bg-leaf-100'}">
       <i class="fa-solid ${i.icon} w-5 text-center"></i>${i.label}</a>`).join('');
  $('navRoot').innerHTML = `
    <header class="sticky top-0 z-40 bg-cream-50/85 backdrop-blur-md border-b border-leaf-100 pt-[env(safe-area-inset-top)]">
      <div class="max-w-xl mx-auto h-14 px-4 flex items-center gap-3">
        <button id="menuOpen" aria-label="Buka menu" class="w-10 h-10 rounded-2xl bg-leaf-100 text-leaf-700 flex items-center justify-center active:scale-95"><i class="fa-solid fa-bars"></i></button>
        <div class="leading-tight">
          <p class="text-[11px] font-bold tracking-wide text-leaf-600 uppercase">Hiro Zenith Report</p>
          <h1 class="text-base font-extrabold text-leaf-900">${pageTitle}</h1>
        </div>
      </div>
    </header>
    <div id="drawer" class="fixed inset-0 z-[60] pointer-events-none">
      <div id="drawerOverlay" class="absolute inset-0 bg-leaf-900/40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
      <aside id="drawerPanel" class="absolute left-0 top-0 h-full w-72 max-w-[82%] bg-cream-50 shadow-2xl -translate-x-full transition-transform duration-300 flex flex-col pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
        <div class="flex items-center justify-between px-5 h-14 border-b border-leaf-100">
          <div class="flex items-center gap-2 font-extrabold text-leaf-800"><i class="fa-solid fa-leaf text-leaf-500"></i> Menu</div>
          <button id="menuClose" aria-label="Tutup menu" class="w-9 h-9 rounded-xl bg-leaf-100 text-leaf-700 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="p-4 space-y-2 flex-1">${links}</nav>
        <div class="p-4 border-t border-leaf-100">
          <button id="btnLock" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold text-rose2-600 bg-rose2-100 active:scale-[.98]">
            <i class="fa-solid fa-lock w-5 text-center"></i>Kunci Aplikasi
          </button>
        </div>
      </aside>
    </div>`;
  const open = () => { $('drawer').classList.remove('pointer-events-none'); $('drawerOverlay').classList.remove('opacity-0'); $('drawerPanel').classList.remove('-translate-x-full'); };
  const close = () => { $('drawer').classList.add('pointer-events-none'); $('drawerOverlay').classList.add('opacity-0'); $('drawerPanel').classList.add('-translate-x-full'); };
  $('menuOpen').addEventListener('click', open);
  $('menuClose').addEventListener('click', close);
  $('drawerOverlay').addEventListener('click', close);
  $('btnLock').addEventListener('click', async () => {
    try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
    location.href = '/login';
  });
}

/* ======================= State ======================= */
const now = new Date();
const S = {
  year: now.getFullYear(),
  month: now.getMonth(),
  byDate: {},
  first: null,
  settings: { includeSaturday: false, includeSunday: false },
  gridStart: null,
  gridEnd: null,
  loadToken: 0,
};

const isWorkday = (iso) => {
  const w = parseISO(iso).getDay();
  if (w === 6) return S.settings.includeSaturday;
  if (w === 0) return S.settings.includeSunday;
  return true;
};

function gridRange(y, m) {
  const firstIso = toISO(new Date(y, m, 1));
  const lastIso = toISO(new Date(y, m + 1, 0));
  return { start: mondayOf(firstIso), end: addDays(mondayOf(lastIso), 6) };
}

/* ======================= Load & render ======================= */
async function loadMonth() {
  const token = ++S.loadToken;
  const { start, end } = gridRange(S.year, S.month);
  S.gridStart = start; S.gridEnd = end;
  $('monthLabel').textContent = `${BULAN[S.month]} ${S.year}`;
  $('monthNow').classList.toggle('hidden', S.year === now.getFullYear() && S.month === now.getMonth());
  $('grid').innerHTML = Array.from({ length: 35 }, () => '<div class="h-12 rounded-2xl bg-leaf-50 animate-pulse"></div>').join('');
  try {
    const rows = await api(`/api/activities?from=${start}&to=${end}`);
    if (token !== S.loadToken) return; // abaikan respons usang
    S.byDate = {};
    rows.forEach((r) => { (S.byDate[r.date] = S.byDate[r.date] || []).push(r); });
    render();
  } catch (e) {
    if (token !== S.loadToken) return;
    $('grid').innerHTML = `<div class="col-span-7 rounded-2xl bg-rose2-100 border border-rose2-200 text-rose2-600 p-4 text-sm font-bold flex items-center gap-3">
      <i class="fa-solid fa-triangle-exclamation"></i><span class="flex-1">${esc(e.message)}</span>
      <button id="retryMonth" class="h-9 px-3 rounded-xl bg-white text-rose2-600 text-xs font-extrabold">Coba lagi</button></div>`;
    $('retryMonth').addEventListener('click', loadMonth);
  }
}

function cellClass(iso, count, inMonth) {
  const wd = isWorkday(iso), today = todayISO();
  const tracked = S.first && iso >= S.first;
  let c;
  if (count > 0) c = 'bg-leaf-400 text-white shadow-sm';
  else if (iso === today && wd) c = 'bg-peach-100 text-peach-600 border-2 border-peach-400';
  else if (iso < today && wd && tracked) c = 'bg-rose2-100 text-rose2-600 border border-rose2-200';
  else if (!wd) c = 'text-leaf-300';
  else c = 'bg-white/80 text-leaf-800 border border-leaf-100';
  if (iso === today && count > 0) c += ' ring-2 ring-peach-400 ring-offset-2 ring-offset-cream-50';
  if (!inMonth) c += ' opacity-40';
  return c;
}

function render() {
  renderGrid();
  renderSummary();
  renderSettings();
}

function renderGrid() {
  const cells = [];
  for (let iso = S.gridStart, guard = 0; iso <= S.gridEnd && guard < 60; iso = addDays(iso, 1), guard++) {
    const d = parseISO(iso);
    const count = (S.byDate[iso] || []).length;
    const inMonth = d.getMonth() === S.month;
    cells.push(`<button data-date="${iso}" aria-label="${longDate(iso)}" class="relative h-12 rounded-2xl text-sm font-extrabold flex items-center justify-center transition active:scale-95 ${cellClass(iso, count, inMonth)}">
      ${d.getDate()}
      ${count ? `<span class="absolute -top-1.5 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-peach-400 text-white text-[10px] font-extrabold flex items-center justify-center shadow">${count}</span>` : ''}
    </button>`);
  }
  $('grid').innerHTML = cells.join('');
}

function renderSummary() {
  const today = todayISO();
  const monthStart = toISO(new Date(S.year, S.month, 1));
  const monthEnd = toISO(new Date(S.year, S.month + 1, 0));
  const days = [];
  for (let d = monthStart; d <= monthEnd; d = addDays(d, 1)) {
    days.push({ date: d, count: (S.byDate[d] || []).length, work: isWorkday(d) });
  }
  const work = days.filter((x) => x.work);
  const due = work.filter((x) => x.date < today || (x.date === today && x.count > 0));
  const filled = due.filter((x) => x.count > 0);
  const missed = work.filter((x) => x.date < today && x.count === 0 && S.first && x.date >= S.first);
  const total = days.reduce((a, x) => a + x.count, 0);
  const pct = due.length ? Math.round((filled.length / due.length) * 100) : 0;
  const shown = missed.slice(0, 24);

  $('summary').innerHTML = `
    <div class="flex items-center justify-between gap-3">
      <div>
        <h3 class="text-base font-extrabold text-leaf-900">Ringkasan ${BULAN[S.month]}</h3>
        <p class="text-xs text-leaf-600">${total} kegiatan · ${filled.length}/${due.length} hari kerja terisi</p>
      </div>
      <div class="text-2xl font-extrabold text-leaf-600">${pct}%</div>
    </div>
    <div class="mt-3 h-3 rounded-full bg-leaf-100 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-leaf-300 to-leaf-500 transition-all duration-700" style="width:${pct}%"></div></div>

    <div class="mt-5">
      <p class="text-sm font-extrabold text-leaf-800 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-rose2-400"></i>Belum dibuat laporan (${missed.length})</p>
      ${missed.length
        ? `<div class="mt-3 flex flex-wrap gap-2">${shown.map((m) => `<a href="/?date=${m.date}" class="inline-flex items-center gap-1.5 h-9 px-3 rounded-full bg-rose2-100 border border-rose2-200 text-rose2-600 text-xs font-extrabold active:scale-95"><i class="fa-solid fa-plus text-[10px]"></i>${shortDate(m.date)}</a>`).join('')}</div>
           ${missed.length > shown.length ? `<p class="mt-2 text-xs text-leaf-600">+ ${missed.length - shown.length} hari lainnya.</p>` : ''}`
        : `<div class="mt-3 rounded-2xl bg-leaf-100 text-leaf-800 p-3.5 text-sm font-bold flex items-center gap-3"><i class="fa-solid fa-circle-check text-leaf-500 text-lg"></i>Tidak ada hari kerja yang terlewat bulan ini.</div>`}
    </div>`;
}

/* ======================= Bottom sheet detail hari ======================= */
function openSheet(iso) {
  const list = S.byDate[iso] || [];
  const today = todayISO();
  const wd = isWorkday(iso);
  $('sheetTitle').textContent = longDate(iso);

  let badge;
  if (list.length) badge = `<span class="inline-flex items-center gap-1.5 rounded-full bg-leaf-500 text-white text-[11px] font-extrabold px-2.5 py-1"><i class="fa-solid fa-circle-check"></i>${list.length} kegiatan</span>`;
  else if (iso === today && wd) badge = `<span class="inline-flex items-center gap-1.5 rounded-full bg-peach-100 text-peach-600 text-[11px] font-extrabold px-2.5 py-1"><i class="fa-solid fa-hourglass-half"></i>Hari ini belum diisi</span>`;
  else if (iso < today && wd && S.first && iso >= S.first) badge = `<span class="inline-flex items-center gap-1.5 rounded-full bg-rose2-100 text-rose2-600 text-[11px] font-extrabold px-2.5 py-1"><i class="fa-solid fa-circle-exclamation"></i>Belum dibuat laporan</span>`;
  else if (!wd) badge = `<span class="inline-flex items-center gap-1.5 rounded-full bg-leaf-100 text-leaf-600 text-[11px] font-extrabold px-2.5 py-1">Di luar hari kerja</span>`;
  else badge = `<span class="inline-flex items-center gap-1.5 rounded-full bg-sky2-100 text-leaf-700 text-[11px] font-extrabold px-2.5 py-1">${iso > today ? 'Belum tiba' : 'Belum ada data'}</span>`;
  $('sheetBadge').innerHTML = badge;

  $('sheetBody').innerHTML = list.length
    ? `<div class="space-y-2.5 pb-1">${list.map((it, n) => `
        <div class="flex gap-3 rounded-2xl bg-white border border-leaf-100 p-3.5">
          <div class="w-6 h-6 shrink-0 rounded-full bg-leaf-100 text-leaf-700 text-xs font-extrabold flex items-center justify-center mt-0.5">${n + 1}</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-leaf-900 break-words">${esc(it.title)}</p>
            ${it.notes ? `<p class="mt-1 text-xs italic text-leaf-600 break-words whitespace-pre-line">${esc(it.notes)}</p>` : ''}
          </div>
          <a href="/?edit=${it.id}" aria-label="Ubah" class="w-9 h-9 shrink-0 rounded-xl bg-peach-100 text-peach-600 flex items-center justify-center active:scale-95"><i class="fa-solid fa-pen text-xs"></i></a>
        </div>`).join('')}</div>`
    : `<div class="rounded-2xl border border-dashed border-leaf-200 p-6 text-center text-sm font-bold text-leaf-500"><i class="fa-regular fa-note-sticky text-2xl block mb-2"></i>Belum ada kegiatan pada tanggal ini.</div>`;

  $('sheetAdd').href = `/?date=${iso}`;
  $('sheet').classList.remove('hidden');
  $('sheet').classList.add('flex');
}
function closeSheet() {
  $('sheet').classList.add('hidden');
  $('sheet').classList.remove('flex');
}

/* ======================= Pengaturan hari kerja ======================= */
function switchRow(key, icon, label, desc, on, locked) {
  return `<div ${locked ? '' : `data-toggle="${key}" role="switch" aria-checked="${on}" tabindex="0"`} class="flex items-center gap-3 rounded-2xl border p-3.5 ${locked ? 'bg-leaf-50 border-leaf-100' : 'bg-white border-leaf-100 cursor-pointer active:scale-[.99]'}">
    <div class="w-10 h-10 rounded-xl ${on ? 'bg-leaf-100 text-leaf-600' : 'bg-cream-100 text-leaf-400'} flex items-center justify-center"><i class="fa-solid ${icon}"></i></div>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-extrabold text-leaf-900">${label}</p>
      <p class="text-xs text-leaf-600">${desc}</p>
    </div>
    <div class="w-12 h-7 rounded-full p-0.5 transition ${on ? 'bg-leaf-500' : 'bg-leaf-200'} ${locked ? 'opacity-60' : ''}">
      <div class="w-6 h-6 rounded-full bg-white shadow transition-transform ${on ? 'translate-x-5' : ''}"></div>
    </div>
  </div>`;
}
function renderSettings() {
  $('workdaySettings').innerHTML =
    switchRow('weekdays', 'fa-business-time', 'Senin – Jumat', 'Selalu dihitung sebagai hari kerja', true, true) +
    switchRow('includeSaturday', 'fa-sun', 'Sabtu', 'Hitung sebagai hari kerja', S.settings.includeSaturday, false) +
    switchRow('includeSunday', 'fa-moon', 'Minggu', 'Hitung sebagai hari kerja', S.settings.includeSunday, false);
}
async function toggleDay(key) {
  const next = { ...S.settings, [key]: !S.settings[key] };
  try {
    S.settings = await api('/api/settings', { method: 'PUT', body: next });
    toast('success', `${key === 'includeSaturday' ? 'Sabtu' : 'Minggu'} ${S.settings[key] ? 'dihitung' : 'tidak dihitung'} sebagai hari kerja.`);
    render();
  } catch (e) { toast('error', e.message); }
}

/* ======================= Init ======================= */
function shiftMonth(delta) {
  const d = new Date(S.year, S.month + delta, 1);
  S.year = d.getFullYear();
  S.month = d.getMonth();
  loadMonth();
}

async function init() {
  mountNav('/calendar', 'Kalender');

  $('monthPrev').addEventListener('click', () => shiftMonth(-1));
  $('monthNext').addEventListener('click', () => shiftMonth(1));
  $('monthNow').addEventListener('click', () => { S.year = now.getFullYear(); S.month = now.getMonth(); loadMonth(); });
  $('grid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-date]');
    if (b) openSheet(b.dataset.date);
  });
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetOverlay').addEventListener('click', closeSheet);
  $('workdaySettings').addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle]');
    if (t) toggleDay(t.dataset.toggle);
  });

  try {
    const [st, meta] = await Promise.all([api('/api/settings'), api('/api/meta')]);
    S.settings = st;
    S.first = meta.firstDate;
  } catch (e) {
    toast('error', e.message);
  }
  await loadMonth();
}
init();
</script>
</body>
</html>
