<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4efdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Export PDF · Hiro Zenith Report</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Nunito', 'ui-sans-serif', 'system-ui', 'sans-serif'], serif: ['"Times New Roman"', 'Times', 'serif'] },
  colors: {
    leaf: { 50:'#f3f8ef',100:'#e4efdb',200:'#cbe1bb',300:'#a9cf94',400:'#86b872',500:'#679d55',600:'#4f7f42',700:'#3f6537',800:'#34512f',900:'#2b4328' },
    cream: { 50:'#fdfcf6',100:'#faf7ea',200:'#f3edd3' },
    sky2: { 100:'#e3f1f4',200:'#c7e3ea',400:'#7fb9c8' },
    peach: { 100:'#fdeedd',200:'#fadcbb',400:'#eea86c',600:'#c8823f' },
    rose2: { 100:'#fbe6e4',200:'#f6cbc7',400:'#e28f88',600:'#c4574f' }
  },
  keyframes: {
    pop: { '0%': { opacity: 0, transform: 'translateY(-8px) scale(.98)' }, '100%': { opacity: 1, transform: 'none' } }
  },
  animation: { pop: 'pop .25s ease-out' }
} } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="font-sans text-leaf-900 min-h-screen antialiased">
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-sky2-100 via-cream-50 to-leaf-100"></div>
<div class="fixed -z-10 top-24 -right-16 w-52 h-52 rounded-full bg-white/60 blur-2xl"></div>

<div id="navRoot"></div>

<div class="fixed top-16 inset-x-0 z-[80] px-4 pointer-events-none">
  <div id="toastList" class="max-w-xl mx-auto space-y-2"></div>
</div>

<main class="max-w-xl mx-auto px-4 pt-4 pb-[calc(2.5rem+env(safe-area-inset-bottom))] space-y-4">

  <!-- Pilih cakupan -->
  <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-2xl bg-leaf-100 text-leaf-600 flex items-center justify-center"><i class="fa-solid fa-file-pdf"></i></div>
      <div>
        <h3 class="text-base font-extrabold text-leaf-900">Export Laporan</h3>
        <p class="text-xs text-leaf-600">Pilih cakupan hari yang ingin dimasukkan ke PDF</p>
      </div>
    </div>
    <div id="modeList" class="space-y-2.5"></div>
  </section>

  <!-- Pilih minggu -->
  <section id="weekCard" class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
    <div class="flex items-center justify-between gap-2">
      <button id="weekPrev" aria-label="Minggu sebelumnya" class="w-11 h-11 rounded-2xl bg-leaf-100 text-leaf-700 active:scale-95 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="text-center min-w-0">
        <p class="text-[11px] font-bold uppercase tracking-wide text-leaf-600">Pilih Minggu</p>
        <h3 id="weekLabel" class="text-base font-extrabold text-leaf-900">—</h3>
      </div>
      <button id="weekNext" aria-label="Minggu berikutnya" class="w-11 h-11 rounded-2xl bg-leaf-100 text-leaf-700 active:scale-95 flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="mt-3 text-center">
      <button id="weekNow" class="hidden h-8 px-3 rounded-full bg-peach-100 text-peach-600 text-xs font-extrabold border border-peach-200">Kembali ke minggu ini</button>
    </div>
  </section>

  <!-- Pratinjau -->
  <section class="rounded-[1.75rem] bg-white/85 backdrop-blur border border-leaf-100 shadow-sm p-5">
    <div class="flex items-center justify-between gap-2 mb-3">
      <h3 class="text-base font-extrabold text-leaf-900">Pratinjau Isi</h3>
      <div id="previewMeta" class="flex gap-2"></div>
    </div>
    <div id="preview" class="rounded-2xl bg-white border border-leaf-200 shadow-inner p-5 font-serif text-[13px] leading-relaxed text-black max-h-[26rem] overflow-y-auto"></div>
  </section>

  <!-- Aksi -->
  <section class="grid grid-cols-5 gap-3">
    <button id="btnPreview" class="col-span-2 h-14 rounded-2xl bg-sky2-100 border border-sky2-200 text-leaf-800 text-sm font-extrabold active:scale-[.98] flex items-center justify-center gap-2">
      <i class="fa-solid fa-eye"></i>Buka
    </button>
    <button id="btnDownload" class="col-span-3 h-14 rounded-2xl bg-leaf-500 hover:bg-leaf-600 text-white text-base font-extrabold shadow-md shadow-leaf-500/30 active:scale-[.98] flex items-center justify-center gap-2">
      <i class="fa-solid fa-download"></i>Unduh PDF
    </button>
  </section>
</main>

<script>
/* ======================= Util umum ======================= */
const $ = (id) => document.getElementById(id);
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const mondayOf = (iso) => { const d = parseISO(iso); const w = d.getDay(); d.setDate(d.getDate() + (w === 0 ? -6 : 1 - w)); return toISO(d); };
const todayISO = () => toISO(new Date());
const longDate = (iso) => { const d = parseISO(iso); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
const rangeLabel = (a, b) => {
  const x = parseISO(a), y = parseISO(b);
  if (x.getFullYear() !== y.getFullYear()) return `${x.getDate()} ${BULAN_S[x.getMonth()]} ${x.getFullYear()} – ${y.getDate()} ${BULAN_S[y.getMonth()]} ${y.getFullYear()}`;
  if (x.getMonth() !== y.getMonth()) return `${x.getDate()} ${BULAN_S[x.getMonth()]} – ${y.getDate()} ${BULAN_S[y.getMonth()]} ${y.getFullYear()}`;
  return `${x.getDate()} – ${y.getDate()} ${BULAN_S[y.getMonth()]} ${y.getFullYear()}`;
};
// Sama dengan format "Periode" pada PDF server
const periodText = (from, to, forceYear) => {
  const a = parseISO(from), b = parseISO(to);
  const sameYear = a.getFullYear() === b.getFullYear();
  const sameMonth = sameYear && a.getMonth() === b.getMonth();
  const part = (d, y) => `${d.getDate()} ${BULAN[d.getMonth()]}${y ? ' ' + d.getFullYear() : ''}`;
  if (from === to) return part(a, true);
  if (sameMonth && !forceYear) return `${a.getDate()}-${b.getDate()} ${BULAN[b.getMonth()]}`;
  if (sameYear && !forceYear) return `${part(a, false)} - ${part(b, false)}`;
  return `${part(a, true)} - ${part(b, true)}`;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(url, opts = {}) {
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
    throw new Error('Sesi berakhir.');
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.message) || 'Terjadi kesalahan pada server.');
  return data;
}

function toast(type, msg) {
  const map = {
    success: ['bg-leaf-100 border-leaf-300 text-leaf-800', 'fa-circle-check'],
    error: ['bg-rose2-100 border-rose2-200 text-rose2-600', 'fa-circle-exclamation'],
    info: ['bg-sky2-100 border-sky2-200 text-leaf-800', 'fa-circle-info'],
  };
  const [cls, icon] = map[type] || map.info;
  const el = document.createElement('div');
  el.className = `pointer-events-auto animate-pop flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-lg ${cls}`;
  el.innerHTML = `<i class="fa-solid ${icon} mt-0.5"></i><p class="text-sm font-bold flex-1 break-words">${esc(msg)}</p>`;
  $('toastList').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
}

/* ======================= Navbar hamburger ======================= */
const NAV_ITEMS = [
  { href: '/', icon: 'fa-house', label: 'Beranda & Laporan' },
  { href: '/calendar', icon: 'fa-calendar-days', label: 'Kalender' },
  { href: '/statistic', icon: 'fa-chart-simple', label: 'Statistik' },
  { href: '/export', icon: 'fa-file-pdf', label: 'Export PDF' },
];
function mountNav(active, pageTitle) {
  const links = NAV_ITEMS.map((i) =>
    `<a href="${i.href}" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold transition ${i.href === active ? 'bg-leaf-500 text-white shadow-sm' : 'text-leaf-800 hover:bg-leaf-100'}">
       <i class="fa-solid ${i.icon} w-5 text-center"></i>${i.label}</a>`).join('');
  $('navRoot').innerHTML = `
    <header class="sticky top-0 z-40 bg-cream-50/85 backdrop-blur-md border-b border-leaf-100 pt-[env(safe-area-inset-top)]">
      <div class="max-w-xl mx-auto h-14 px-4 flex items-center gap-3">
        <button id="menuOpen" aria-label="Buka menu" class="w-10 h-10 rounded-2xl bg-leaf-100 text-leaf-700 flex items-center justify-center active:scale-95"><i class="fa-solid fa-bars"></i></button>
        <div class="leading-tight">
          <p class="text-[11px] font-bold tracking-wide text-leaf-600 uppercase">Hiro Zenith Report</p>
          <h1 class="text-base font-extrabold text-leaf-900">${pageTitle}</h1>
        </div>
      </div>
    </header>
    <div id="drawer" class="fixed inset-0 z-[60] pointer-events-none">
      <div id="drawerOverlay" class="absolute inset-0 bg-leaf-900/40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>
      <aside id="drawerPanel" class="absolute left-0 top-0 h-full w-72 max-w-[82%] bg-cream-50 shadow-2xl -translate-x-full transition-transform duration-300 flex flex-col pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
        <div class="flex items-center justify-between px-5 h-14 border-b border-leaf-100">
          <div class="flex items-center gap-2 font-extrabold text-leaf-800"><i class="fa-solid fa-leaf text-leaf-500"></i> Menu</div>
          <button id="menuClose" aria-label="Tutup menu" class="w-9 h-9 rounded-xl bg-leaf-100 text-leaf-700 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="p-4 space-y-2 flex-1">${links}</nav>
        <div class="p-4 border-t border-leaf-100">
          <button id="btnLock" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-bold text-rose2-600 bg-rose2-100 active:scale-[.98]">
            <i class="fa-solid fa-lock w-5 text-center"></i>Kunci Aplikasi
          </button>
        </div>
      </aside>
    </div>`;
  const open = () => { $('drawer').classList.remove('pointer-events-none'); $('drawerOverlay').classList.remove('opacity-0'); $('drawerPanel').classList.remove('-translate-x-full'); };
  const close = () => { $('drawer').classList.add('pointer-events-none'); $('drawerOverlay').classList.add('opacity-0'); $('drawerPanel').classList.add('-translate-x-full'); };
  $('menuOpen').addEventListener('click', open);
  $('menuClose').addEventListener('click', close);
  $('drawerOverlay').addEventListener('click', close);
  $('btnLock').addEventListener('click', async () => {
    try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
    location.href = '/login';
  });
}

/* ======================= State ======================= */
const MODES = [
  { key: 'weekday', icon: 'fa-briefcase', title: 'Senin – Jumat', desc: 'Satu minggu kerja (5 hari)' },
  { key: 'fullweek', icon: 'fa-calendar-week', title: 'Senin – Minggu', desc: 'Satu minggu penuh (7 hari)' },
  { key: 'all', icon: 'fa-layer-group', title: 'Semua Laporan', desc: 'Seluruh kegiatan yang pernah dicatat' },
];
const S = { mode: 'weekday', week: mondayOf(todayISO()), items: [], config: { name: '', org: 'LPK ZENITH' }, token: 0, loading: false };

function currentRange() {
  if (S.mode === 'all') return null;
  return { from: S.week, to: addDays(S.week, S.mode === 'weekday' ? 4 : 6) };
}

/* ======================= Render ======================= */
function renderModes() {
  $('modeList').innerHTML = MODES.map((m) => {
    const on = S.mode === m.key;
    return `<div data-mode="${m.key}" role="radio" aria-checked="${on}" tabindex="0" class="flex items-center gap-3 rounded-2xl border-2 p-3.5 cursor-pointer transition active:scale-[.99] ${on ? 'border-leaf-500 bg-leaf-50' : 'border-leaf-100 bg-white'}">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center ${on ? 'bg-leaf-500 text-white' : 'bg-leaf-100 text-leaf-600'}"><i class="fa-solid ${m.icon}"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-extrabold text-leaf-900">${m.title}</p>
        <p class="text-xs text-leaf-600">${m.desc}</p>
      </div>
      <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${on ? 'border-leaf-500 bg-leaf-500 text-white' : 'border-leaf-200'}">${on ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}</div>
    </div>`;
  }).join('');
}

function renderWeekCard() {
  const r = currentRange();
  $('weekCard').classList.toggle('hidden', !r);
  if (!r) return;
  $('weekLabel').textContent = rangeLabel(r.from, r.to);
  $('weekNow').classList.toggle('hidden', S.week === mondayOf(todayISO()));
}

function renderPreview() {
  const items = S.items;
  const days = [];
  items.forEach((it) => {
    let last = days[days.length - 1];
    if (!last || last.date !== it.date) { last = { date: it.date, list: [] }; days.push(last); }
    last.list.push(it);
  });

  const isAll = S.mode === 'all';
  let from, to;
  if (isAll) { if (items.length) { from = items[0].date; to = items[items.length - 1].date; } }
  else { ({ from, to } = currentRange()); }

  $('previewMeta').innerHTML = `
    <span class="inline-flex items-center gap-1.5 text-[11px] font-extrabold bg-leaf-100 text-leaf-800 rounded-full px-2.5 py-1"><i class="fa-solid fa-list-check"></i>${items.length}</span>
    <span class="inline-flex items-center gap-1.5 text-[11px] font-extrabold bg-sky2-100 text-leaf-800 rounded-full px-2.5 py-1"><i class="fa-regular fa-calendar"></i>${days.length} hari</span>`;

  const disabled = items.length === 0;
  ['btnDownload', 'btnPreview'].forEach((id) => {
    $(id).disabled = disabled;
    $(id).classList.toggle('opacity-50', disabled);
    $(id).classList.toggle('pointer-events-none', disabled);
  });

  if (!items.length) {
    $('preview').className = 'rounded-2xl bg-cream-50 border border-dashed border-leaf-200 p-8 text-center font-sans text-sm font-bold text-leaf-500';
    $('preview').innerHTML = `<i class="fa-regular fa-folder-open text-3xl block mb-2"></i>Belum ada kegiatan pada periode ini.`;
    return;
  }

  $('preview').className = 'rounded-2xl bg-white border border-leaf-200 shadow-inner p-5 font-serif text-[13px] leading-relaxed text-black max-h-[26rem] overflow-y-auto';
  $('preview').innerHTML = `
    <div class="text-center font-bold">
      <div class="text-[15px]">${esc(isAll ? 'LAPORAN KEGIATAN' : 'LAPORAN MINGGUAN')} ${esc(S.config.org)}</div>
      <div class="mt-1">Periode : ${esc(periodText(from, to, isAll))}</div>
      <div class="mt-1 pb-1 border-b border-black">${esc(S.config.name)}</div>
    </div>
    <div class="mt-3 space-y-3">
      ${days.map((d) => `
        <div>
          <div class="font-bold">${longDate(d.date)}</div>
          <ol class="list-decimal pl-6 mt-0.5 space-y-0.5">
            ${d.list.map((it) => `<li class="break-words">${esc(it.title)}${it.notes ? `<div class="italic text-[12px] text-neutral-600 whitespace-pre-line">Catatan: ${esc(it.notes)}</div>` : ''}</li>`).join('')}
          </ol>
        </div>`).join('')}
    </div>`;
}

async function loadPreview() {
  const token = ++S.token;
  $('preview').className = 'rounded-2xl bg-leaf-50 border border-leaf-100 p-8 text-center font-sans text-sm font-bold text-leaf-600';
  $('preview').innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat pratinjau...';
  const r = currentRange();
  try {
    const rows = await api('/api/activities' + (r ? `?from=${r.from}&to=${r.to}` : ''));
    if (token !== S.token) return;
    S.items = rows;
    renderPreview();
  } catch (e) {
    if (token !== S.token) return;
    S.items = [];
    renderPreview();
    toast('error', e.message);
  }
}

function refresh() {
  renderModes();
  renderWeekCard();
  loadPreview();
}

/* ======================= Aksi export ======================= */
function pdfUrl(inline) {
  let url = `/api/export/pdf?mode=${S.mode}&week=${S.week}`;
  if (inline) url += '&inline=1';
  return url;
}
function doDownload() {
  if (!S.items.length) { toast('info', 'Belum ada kegiatan pada periode ini.'); return; }
  toast('success', 'Menyiapkan PDF untuk diunduh...');
  window.location.href = pdfUrl(false);
}
function doOpen() {
  if (!S.items.length) { toast('info', 'Belum ada kegiatan pada periode ini.'); return; }
  window.open(pdfUrl(true), '_blank', 'noopener');
}

/* ======================= Init ======================= */
async function init() {
  mountNav('/export', 'Export PDF');

  $('modeList').addEventListener('click', (e) => {
    const m = e.target.closest('[data-mode]');
    if (!m || m.dataset.mode === S.mode) return;
    S.mode = m.dataset.mode;
    refresh();
  });
  $('weekPrev').addEventListener('click', () => { S.week = addDays(S.week, -7); refresh(); });
  $('weekNext').addEventListener('click', () => { S.week = addDays(S.week, 7); refresh(); });
  $('weekNow').addEventListener('click', () => { S.week = mondayOf(todayISO()); refresh(); });
  $('btnDownload').addEventListener('click', doDownload);
  $('btnPreview').addEventListener('click', doOpen);

  try { S.config = await api('/api/config'); } catch (e) { toast('error', e.message); }
  refresh();
}
init();
</script>
</body>
</html>
